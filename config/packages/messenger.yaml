framework:
    messenger:
        # Send failed messages to the "failed" transport instead of dropping them silently.
        # The worker has no database, so the doctrine transport is not available : a
        # dedicated AMQP exchange is used (fanout, because the failed envelope keeps the
        # original AmqpStamp whose routing key is the worker IP).
        # See docs/start-resync-state-started.md §5.4
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            worker: 
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: worker
                        type: direct
                    queues:
                        #name of the queue linked to the worker
                        messages_worker1:
                            binding_keys: [192.168.11.132]
                retry_strategy:
                    max_retries: 3
                    # milliseconds delay
                    delay: 2000
                    # causes the delay to be higher before each retry
                    # e.g. 1 second delay, 2 seconds, 4 seconds
                    multiplier: 1
                    max_delay: 0
                    # override all of this with a service that
                    # implements Symfony\Component\Messenger\Retry\RetryStrategyInterface
                    # service: null
            front: 
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: front
                    queues:
                        messages_front: ~
                retry_strategy:
                    max_retries: 3
                    # milliseconds delay
                    delay: 2000
                    # causes the delay to be higher before each retry
                    # e.g. 1 second delay, 2 seconds, 4 seconds
                    multiplier: 1
                    max_delay: 0
                    # override all of this with a service that
                    # implements Symfony\Component\Messenger\Retry\RetryStrategyInterface
                    # service: null
            # Failed messages : kept in a dedicated AMQP exchange (see failure_transport above)
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: failed
                        type: fanout
                    queues:
                        messages_failed: ~
            # sync: 'sync://'

        routing:
            # Route your messages to the transports
            'Remotelabz\Message\Message\InstanceActionMessage': worker
            'Remotelabz\Message\Message\InstanceLogMessage': front
            'Remotelabz\Message\Message\InstanceStateMessage': front
            'Remotelabz\Message\Message\WorkerHandshakeMessage': front
