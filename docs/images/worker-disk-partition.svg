<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gUbuntu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf1fb"/>
      <stop offset="100%" stop-color="#d3e2f6"/>
    </linearGradient>
    <linearGradient id="gRlz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdeee0"/>
      <stop offset="100%" stop-color="#f8ddc4"/>
    </linearGradient>
    <linearGradient id="gLv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbe7d2"/>
      <stop offset="100%" stop-color="#f7dcc0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="980" height="700" fill="#ffffff"/>

  <text x="490" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2d3d">Schéma de partitionnement — Worker Remotelabz</text>
  <text x="490" y="68" text-anchor="middle" font-size="13.5" fill="#5a6b7b">LVM : 2 groupes de volumes (VG) + un pool thin dédié aux instances LXC</text>

  <!-- Disque physique -->
  <text x="40" y="106" font-size="13" font-weight="700" fill="#33475b">① Disque physique</text>

  <rect x="40" y="116" width="240" height="64" rx="8" fill="url(#gUbuntu)" stroke="#2b5b9c" stroke-width="1.5"/>
  <rect x="280" y="116" width="660" height="64" rx="8" fill="url(#gRlz)" stroke="#b5651d" stroke-width="1.5"/>

  <text x="160" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1b3a63">ubuntu-vg</text>
  <text x="160" y="167" text-anchor="middle" font-size="12" fill="#33517e">≥ 35 GB</text>

  <text x="610" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#7a3f10">rlz-vg</text>
  <text x="610" y="167" text-anchor="middle" font-size="12" fill="#8a5a2b">tout l'espace restant</text>

  <!-- Connecteurs -->
  <line x1="160" y1="180" x2="160" y2="216" stroke="#2b5b9c" stroke-width="2"/>
  <line x1="610" y1="180" x2="610" y2="216" stroke="#b5651d" stroke-width="2"/>

  <!-- LV système -->
  <rect x="40" y="216" width="240" height="160" rx="10" fill="url(#gUbuntu)" stroke="#2b5b9c" stroke-width="1.5"/>
  <rect x="40" y="216" width="7" height="160" rx="3" fill="#2b5b9c"/>
  <text x="66" y="252" font-size="17" font-weight="700" fill="#1b3a63">ubuntu-lv</text>
  <text x="66" y="284" font-size="13" fill="#33517e">Taille : ≥ 35 GB</text>
  <text x="66" y="310" font-size="13" fill="#33517e">Montage : /  (racine)</text>
  <text x="66" y="336" font-size="13" fill="#33517e">Système Ubuntu</text>

  <!-- Panneau rlz-vg -->
  <rect x="280" y="216" width="660" height="408" rx="12" fill="#fffaf4" stroke="#ecd6bd" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- rlz-lv -->
  <rect x="296" y="232" width="628" height="102" rx="10" fill="url(#gLv)" stroke="#e08a3c" stroke-width="1.5"/>
  <rect x="296" y="232" width="7" height="102" rx="3" fill="#e08a3c"/>
  <text x="322" y="266" font-size="17" font-weight="700" fill="#7a3f10">rlz-lv</text>
  <text x="322" y="294" font-size="13" fill="#6b5236">Taille : 60 % de l'espace libre restant</text>
  <text x="322" y="318" font-size="13" fill="#6b5236">Montage : /opt  —  VMs QEMU</text>

  <!-- lib-lxc -->
  <rect x="296" y="348" width="628" height="102" rx="10" fill="#e2f2f1" stroke="#3c8f8f" stroke-width="1.5"/>
  <rect x="296" y="348" width="7" height="102" rx="3" fill="#3c8f8f"/>
  <text x="322" y="382" font-size="17" font-weight="700" fill="#1f5f5f">lib-lxc</text>
  <text x="322" y="410" font-size="13" fill="#2f5f5f">Taille : 100 GB (fixe)</text>
  <text x="322" y="434" font-size="13" fill="#2f5f5f">Montage : /var/lib/lxc  —  modèles / conteneurs de référence</text>

  <!-- Pool thin des instances LXC -->
  <rect x="296" y="464" width="628" height="146" rx="10" fill="#f3ecfa" stroke="#8a6bb8" stroke-width="1.5"/>
  <rect x="296" y="464" width="7" height="146" rx="3" fill="#8a6bb8"/>
  <text x="322" y="494" font-size="17" font-weight="700" fill="#5a3f85">rlz-lxc-pool  (thin pool)</text>
  <text x="322" y="518" font-size="13" fill="#634f86">Taille : tout l'espace libre restant  —  volumes LXC créés à la volée</text>

  <rect x="322" y="534" width="182" height="58" rx="8" fill="#e6d9f5" stroke="#9d7fc9" stroke-width="1.2"/>
  <text x="413" y="558" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a3370">lxc_&lt;uuid1&gt;</text>
  <text x="413" y="578" text-anchor="middle" font-size="11" fill="#634f86">thin — créé à la volée</text>

  <rect x="519" y="534" width="182" height="58" rx="8" fill="#e6d9f5" stroke="#9d7fc9" stroke-width="1.2"/>
  <text x="610" y="558" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a3370">lxc_&lt;uuid2&gt;</text>
  <text x="610" y="578" text-anchor="middle" font-size="11" fill="#634f86">thin — créé à la volée</text>

  <rect x="716" y="534" width="182" height="58" rx="8" fill="#f3ecfa" stroke="#b9a3d6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="807" y="558" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b5a8c">…</text>
  <text x="807" y="578" text-anchor="middle" font-size="11" fill="#6b5a8c">d'autres instances</text>

  <text x="322" y="606" font-size="11.5" fill="#6b5a8c">Montage : /var/lib/lxc/&lt;uuid&gt;/rootfs  —  un LV thin par instance utilisateur</text>

  <!-- Notes -->
  <rect x="40" y="644" width="900" height="44" rx="8" fill="#f6f8fa" stroke="#dfe4ea"/>
  <text x="60" y="664" font-size="12" fill="#3a4a5a"><tspan font-weight="700">Provisionnement thin :</tspan> les LV lxc_&lt;uuid&gt; sont créés/supprimés à la volée dans rlz-lxc-pool (sur-allocation).</text>
  <text x="60" y="681" font-size="12" fill="#7a8794">Un VG à 0 PE libre peut encore créer des volumes thin : surveiller data_percent / metadata_percent du pool.</text>
</svg>
